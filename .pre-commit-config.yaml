# Fast checks only. Kotlin formatting is deliberately absent: Spotless and detekt need a
# Gradle daemon, which turns a commit into a multi-second wait. Those run in CI and in the
# IDE instead — see the Android workflow.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Two trailing spaces are a line break in Markdown.
        exclude_types: [markdown]
      - id: end-of-file-fixer
      - id: check-yaml
        # Blueprints are Home Assistant YAML, where `!input` is a tag this loader has
        # never heard of. Checked below instead, for syntax only.
        exclude: ^blueprints/
      - id: check-yaml
        name: check-yaml (Home Assistant tags)
        alias: check-yaml-ha
        files: ^blueprints/
        args: [--unsafe]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: mixed-line-ending
        args: [--fix=lf]
        # gradlew.bat is a Windows batch file and keeps CRLF; .gitattributes says so too.
        exclude: ^gradlew\.bat$
      # The app stores broker credentials and a parent PIN; a stray key must not reach a
      # commit in the first place.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Kotlin formatting, which nothing else here checked — so a badly placed comment could be
  # committed and pushed, and was. Three times in one day the same mistake: an insertion
  # landing between a KDoc and the declaration it documents, which ktlint refuses and no
  # Python hook could ever see.
  #
  # Runs only when Kotlin is staged, and only spotless: detekt and the tests belong in CI,
  # where waiting is free. This is the check that catches a whole class of edit mistake at
  # the moment it is made rather than after it has travelled.
  - repo: local
    hooks:
      - id: spotless
        name: spotless (Kotlin formatting)
        entry: ./gradlew --quiet spotlessCheck
        language: system
        files: \.(kt|kts)$
        pass_filenames: false
