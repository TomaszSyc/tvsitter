version: 2

updates:
  # Reads gradle/libs.versions.toml as well as the build scripts.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # AndroidX releases move together; one PR per week beats fifteen.
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]

  # The Supervisor base image the panel's Dockerfile builds from. Only `docker` here: the
  # `pip` entry below already finds `parent-panel/requirements.txt`, and declaring a second
  # one for the same directory produced two pull requests for the same bump — #125 and #126,
  # the first thing this repository did on the day it went public.
  - package-ecosystem: docker
    directory: "/parent-panel"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]

  # requirements-dev.txt and the panel's requirements.txt, which this finds on its own. The
  # integration itself declares no requirements and gets its dependencies from Home Assistant.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
    ignore:
      # pytest-homeassistant-custom-component pins one pytest exactly — 0.13.356 wants
      # pytest==9.0.3 — so a bump here is a dependency conflict rather than an upgrade, and
      # the tests passing anyway is not the same as it being installable. It moves when the
      # plugin moves, which is when Home Assistant does. #88 was that PR, closed unmerged.
      - dependency-name: pytest
      # Same reasoning one step up: this pin and the homeassistant pin have to move together,
      # and test_imports.py fails if they ever disagree. Worth a deliberate pair of edits
      # rather than two pull requests that are each wrong on their own.
      - dependency-name: pytest-homeassistant-custom-component
      - dependency-name: homeassistant
