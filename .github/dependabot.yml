version: 2

updates:
  # Reads gradle/libs.versions.toml as well as the build scripts.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      # AndroidX releases move together; one PR per week beats fifteen.
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]

  # requirements-dev.txt only. The integration itself declares no requirements and gets
  # its dependencies from Home Assistant.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies"]
