name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests and APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Sets ANDROID_HOME. local.properties is gitignored, so the SDK has to be
      # discovered through the environment.
      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6

      # Formatting and static analysis share the Gradle daemon and cache with the build,
      # so they belong in this job rather than a separate one.
      - name: Formatting
        run: ./gradlew spotlessCheck

      - name: Static analysis
        run: ./gradlew detekt

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: Unit tests for the rules engine
        run: ./gradlew :rules:test

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: tvsitter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            rules/build/reports/
            app/build/reports/
