name: HACS

# Manual and scheduled only, not on every push. This project is installed through HACS as a
# custom repository and is not submitted to the default store, so most of what this action
# checks — a release, the store listing rules — is not a gate on anything here. It runs weekly
# to catch the parts that do matter: that `hacs.json` parses and the integration is laid out
# where HACS looks for it.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Home Assistant manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
