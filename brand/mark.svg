<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- TV Sitter: a screen with the evening's time still in it.
       One shape, one accent, and nothing that dies at 48 px. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A38"/>
      <stop offset="1" stop-color="#0E1720"/>
    </linearGradient>
  </defs>

  <rect width="192" height="192" rx="44" fill="url(#face)"/>

  <!-- the screen -->
  <rect x="32" y="44" width="128" height="88" rx="18"
        fill="none" stroke="#5BE1BE" stroke-width="11"/>

  <!-- the time left: three quarters of a dial, a quarter spent -->
  <path d="M96 88 L96 66 A22 22 0 1 1 74 88 Z" fill="#5BE1BE"/>

  <!-- the stand, which is what makes it a television rather than a window -->
  <rect x="74" y="142" width="44" height="12" rx="6" fill="#5BE1BE"/>
</svg>
