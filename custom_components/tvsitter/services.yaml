# Answering a request the child made on the TV. The TV ignores an answer carrying an
# unknown or already-settled req_id, so a parent tapping a notification twice grants once.
grant_time:
  target:
    entity:
      integration: tvsitter
      domain: event
  fields:
    minutes:
      required: true
      example: 15
      selector:
        number:
          min: 1
          max: 240
          unit_of_measurement: min
    req_id:
      required: false
      example: 8f14e45f
      selector:
        text:

deny_time:
  target:
    entity:
      integration: tvsitter
      domain: event
  fields:
    req_id:
      required: false
      example: 8f14e45f
      selector:
        text:

# One day of the week, because a week is seven numbers and an action that takes all of
# them means retyping the six that are not changing. Leave the minutes out to hand the
# day back to the plain daily limit; zero is a real setting and means no viewing.
set_schedule:
  target:
    entity:
      integration: tvsitter
      domain: sensor
  fields:
    day:
      required: true
      example: sat
      selector:
        select:
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    minutes:
      required: false
      example: 120
      selector:
        number:
          min: 0
          max: 720
          unit_of_measurement: min

# The whole list every time: windows have no key a parent names, so there is nothing to
# merge onto. An empty list allows viewing at any hour.
set_windows:
  target:
    entity:
      integration: tvsitter
      domain: sensor
  fields:
    windows:
      required: true
      example: >-
        [{"id": "school", "from": "16:00", "to": "19:30",
          "days": ["mon", "tue", "wed", "thu", "fri"]}]
      selector:
        object:

# The everyday way to give an app a budget is the number entity beside its sensor. This is for
# the two things a number cannot say: an app the television has never opened, and taking a
# budget away again — zero is a block, not an absence.
set_app_limit:
  target:
    entity:
      integration: tvsitter
      domain: sensor
  fields:
    package:
      required: true
      example: com.netflix.ninja
      selector:
        text:
    minutes:
      required: false
      example: 30
      selector:
        number:
          min: 0
          max: 720
          unit_of_measurement: min

# The weekly grid Home Assistant already draws. The helper is remembered, so an edit to it
# reaches the television by itself afterwards.
use_schedule:
  target:
    entity:
      integration: tvsitter
      domain: sensor
  fields:
    schedule:
      required: true
      example: schedule.viewing_hours
      selector:
        entity:
          domain: schedule

# Which apps exist for this child at all. Sent whole every time — an allow-list has no key to
# merge onto — and an empty list allows everything rather than nothing.
set_allowed_apps:
  target:
    entity:
      integration: tvsitter
      domain: sensor
  fields:
    packages:
      required: true
      example: '["com.netflix.ninja", "com.google.android.youtube.tv"]'
      selector:
        object:
