# The parent panel. It talks to Home Assistant and never to the broker (D34), so it asks for
# the Core API and nothing else — no `services: mqtt:need`, no broker credentials, and no
# second writer on topics whose safety rests on there being one.
name: TV Sitter parent panel
version: "0.6.18"
slug: tvsitter_panel
description: The parent's pages for TV Sitter — what is on, what was watched, and the rules
url: https://github.com/TomaszSyc/tvsitter/tree/main/parent-panel
# Only what is built and tested. The Supervisor hides an app whose arch is not claimed, which
# is a better failure than an image that pulls and will not run.
arch:
  - aarch64
  - amd64
image: ghcr.io/tomaszsyc/tvsitter-parent-panel-{arch}
init: false
# After Home Assistant, because every page here is a question for its API.
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:television-play
panel_title: TV Sitter
homeassistant_api: true
options: {}
schema: {}
