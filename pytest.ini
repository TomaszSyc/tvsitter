; Pytest configuration. A file of its own rather than a [tool.pytest] table, for the same
; reason ruff.toml exists: this repository is not a Python package, and inventing package
; metadata to hold a test setting would be misleading.
[pytest]
testpaths = tests

; Home Assistant's own test suite runs in this mode, and the fixtures in
; pytest-homeassistant-custom-component are written for it: async tests and async fixtures
; are picked up without marking each one.
asyncio_mode = auto
