# Only deviations from detekt's defaults live here; everything else is inherited via
# buildUponDefaultConfig.
build:
  maxIssues: 0

style:
  MagicNumber:
    # Overriding `excludes` replaces detekt's defaults rather than adding to them, so the
    # test globs have to be repeated here — test fixtures are supposed to be literal.
    # Colours, text sizes and paddings in the lock overlay are inherently literal too;
    # naming every one of them would add indirection without adding meaning.
    excludes:
      - "**/test/**"
      - "**/androidTest/**"
      - "**/*.Test.kt"
      - "**/*.Spec.kt"
      - "**/LockOverlay.kt"
      - "**/SetupActivity.kt"
  ReturnCount:
    active: false

complexity:
  LongMethod:
    # LockOverlay.show builds a view tree; splitting it purely to satisfy a line count
    # would scatter one readable layout across several functions.
    threshold: 80
  TooManyFunctions:
    thresholdInClasses: 15
    # Objects get the same allowance as classes. The default is lower for no reason that
    # applies here: ContractCodec is an encode/decode pair per payload type, so its size
    # tracks the contract's size, and five ways to spell `encode` is one idea rather than
    # five. Splitting it by direction would put the schema check somewhere other than the
    # decoders it guards.
    thresholdInObjects: 15
